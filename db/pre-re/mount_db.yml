###########################################################################
# Pre-Renewal Mount Database
###########################################################################
#
# Mount Settings
#
###########################################################################
# - Id                      Monster that can be used as pet
#   Mount Name              Pet Tame Item.
#   MaxHP                   Pet Egg Item.
#   Race                    Pet Accessory Item. (Default: 0)
#   Element                 Pet Food Item. (Default: 0)
#   ElementLvl              The amount of hunger is decreased every [HungryDelay] seconds.
#   Size                    The amount of time in seconds it takes for hunger to decrease after feeding. (Default: 60)
#   SpeedBonus              The amount of hunger that is increased every time the pet is fed (Default: 20)
#   Cast                    Amount of Intimacy the pet starts with. (Default: 250)
#   Aura                    Amount of Intimacy that is increased when fed. (Default: 50)
#   SummonItem              Amount of Intimacy that is increased when over-fed. (Default: -100)
#   Jobs                    Amount of Intimacy that is increased when the pet is hungry. (Default: -5)
#   Classes                 Amount of Intimacy that is increased when the pet owner dies. (Default: -20)
#   Script                  Capture success rate. (10000 = 100%)
#   EquipScript             If a pet has a Special Performance. (Default: true)
#   UnEquipScript           Rate of which the pet will attack [requires at least pet_support_min_friendly intimacy]. (10000 = 100%)

###########################################################################

